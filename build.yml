name: Build MegaStack Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven ile derle
        run: mvn -B package

      - name: Jar dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: MegaStack
          path: target/MegaStack.jar
